[package]
authors = { workspace = true }
categories = { workspace = true }
description = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
name = "zenoh-runtime"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
tracing-instrument = []

[dependencies]
lazy_static = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "rt",
  "sync",
  "time",
] }
tracing = { workspace = true }
zenoh-macros = { workspace = true }
zenoh-result = { workspace = true, features = ["std"] }

# block_in_place needs "rt-multi-thread"; wasm32 only borrows an ambient current_thread runtime
# (see ZRuntimePool::get()) and never builds its own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread"] }

[package.metadata.cargo-machete]
ignored = ["ron"]
