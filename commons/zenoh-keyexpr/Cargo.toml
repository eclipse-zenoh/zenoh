[package]
authors = { workspace = true }
categories = { workspace = true }
description = "Internal crate for zenoh."
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
name = "zenoh-keyexpr"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[features]
default = ["std"]
internal = []
js = ["getrandom/js"]
std = ["dep:schemars", "zenoh-result/std"]
unstable = []

[dependencies]
keyed-set = { workspace = true }
rand = { workspace = true, features = ["alloc", "getrandom"] }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["alloc"] }
token-cell = { workspace = true }
zenoh-result = { workspace = true }
# NOTE: getrandom needs to be explicitly added here in order to enable the `js` feature when compiling the rand crate to WASM
# more information: https://docs.rs/getrandom/latest/getrandom/#webassembly-support 
getrandom = { workspace = true }
# hashbrown is only *used* in `no_std` builds (see `keyexpr_tree/impls/hashmap_impl.rs`),
# but Cargo cannot express "depend on this crate only when a feature is *off*" in a
# `[target.'cfg(...)'.dependencies]` section — `cfg(not(feature = "std"))` there still
# resolves the dependency unconditionally, and the previously written `cfg(not(features = "std"))`
# (plural `features`) was silently a typo that made the dependency unconditional anyway.
# Since hashbrown 0.16 has no `std` feature and is always `no_std`-compatible, we keep it
# as a plain dependency instead of a misleading target-gated one.
hashbrown = { workspace = true }

# NOTE: May cause problems when testing no_std stuff. Check this tool: https://docs.rs/crate/cargo-no-dev-deps/0.1.0
[dev-dependencies]
ahash = { workspace = true, default-features = true }
criterion = { workspace = true }
lazy_static = { workspace = true }
rand = { workspace = true, features = ["default"] }
test-case = { workspace = true }

[[bench]]
harness = false
name = "keyexpr_tree"

# NOTE: for the above reason, we need to explicitly ignore getrandom in the CI because it's an indirect dependency which is not used directly by zenoh.
[package.metadata.cargo-machete]
ignored = ["getrandom"]
