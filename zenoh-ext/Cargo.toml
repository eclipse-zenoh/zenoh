[package]
authors = ["Julien Enoch <julien@enoch.fr>", "kydos <angelo@icorsaro.net>"]
categories = { workspace = true }
description = "Zenoh: extensions to the client API."
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
name = "zenoh-ext"
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["zenoh/default"]
internal = []
unstable = ["zenoh/internal", "zenoh/unstable"]
# Assert, where `AdvancedSubscriber` calls user code, that no Zenoh sync lock
# guard is held. Off by default: it is an instrument, not a fix, and it costs a
# panic rather than a diagnostic when it fires. Requires `debug_assertions`;
# a no-op otherwise.
#
# `zenoh-ext` itself is clean under it. It does still fire on the transport
# receive path, which holds the per-priority RX channel lock across the whole
# dispatch — that is deliberate delivery serialisation, not a defect, and is the
# known false positive documented in `zenoh_core::tracking`.
reentrancy-tripwire = ["zenoh/internal"]

[dependencies]
bincode = { workspace = true }
flume = { workspace = true }
futures = { workspace = true }
leb128 = { workspace = true }
lru = { workspace = true }
serde = { workspace = true, features = ["default"] }
tokio = { workspace = true, features = [
  "io-std",
  "macros",
  "rt",
  "sync",
  "time",
] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uhlc = { workspace = true }
zenoh = { workspace = true, default-features = false }
zenoh-macros = { workspace = true }
zenoh-util = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
zenoh-config = { workspace = true }
zenoh-test = { workspace = true, features = ["internal", "unstable"] }

[package.metadata.docs.rs]
features = ["unstable"]
